<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--accent:#6c63ff;--bg:#0d0a1f;--bg2:#15112e;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.14);--text:#f1eeff;--mute:#a9a3c9;
--head:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"DM Sans",system-ui,sans-serif}
[data-theme=light]{--bg:#f6f4ff;--bg2:#ffffff;--card:rgba(20,10,60,.04);--line:rgba(20,10,60,.16);--text:#16113a;--mute:#5d5880}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--text);font:400 1rem/1.65 var(--body);overflow-x:hidden}
a{color:inherit}
h1,h2,h3{font-family:var(--head);line-height:1.08;letter-spacing:-.02em}
h2{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:2rem}
section{padding:6rem 1.5rem;max-width:1040px;margin:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* glow that follows the cursor */
#glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(520px circle at var(--x,50%) var(--y,20%),color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%)}
main,nav,footer{position:relative;z-index:1}
nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.5rem;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
nav b{font:800 1.2rem var(--head)}
nav div{display:flex;gap:1.4rem;font-size:.95rem;color:var(--mute);overflow-x:auto}
nav a{text-decoration:none;white-space:nowrap}nav a:hover{color:var(--text)}
/* hero */
#hero{min-height:88vh;display:grid;align-content:center;gap:1.4rem;padding-top:4rem}
.hello{justify-self:start;display:flex;align-items:center;gap:.7rem;padding:.35rem 1rem .35rem .4rem;border:1px solid var(--line);border-radius:99px;color:var(--mute);font-size:.95rem}
.hello img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--accent)}
.hello i{width:34px;height:34px;border-radius:50%;background:var(--accent);display:block}
#hero h1{font-size:clamp(2.6rem,9vw,6.4rem);font-weight:800;max-width:14ch}
.type{font:500 clamp(1.2rem,3vw,1.8rem) var(--head);color:var(--mute);min-height:1.6em}
.type span{color:var(--text)}
.type::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;background:var(--accent);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btns{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.6rem}
.btn{padding:.8rem 1.5rem;border-radius:99px;border:1px solid var(--line);text-decoration:none;font-weight:500;transition:.2s;cursor:pointer;background:none;color:var(--text);font:inherit}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 40%,transparent)}
.rise>*{animation:rise .8s both}
.rise>*:nth-child(2){animation-delay:.12s}.rise>*:nth-child(3){animation-delay:.24s}.rise>*:nth-child(4){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
/* about */
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:3rem;align-items:start}
.about img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;box-shadow:0 0 80px color-mix(in srgb,var(--accent) 35%,transparent)}
.about p{color:var(--mute);font-size:1.1rem;white-space:pre-line;max-width:62ch}
.chips{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.5rem}
.chip{padding:.35rem .9rem;border:1px solid var(--line);border-radius:99px;font-size:.9rem;text-decoration:none}
/* skills: outlined pills, fill shows level */
.cat{margin-bottom:1.6rem}.cat h3{font-size:1.1rem;color:var(--mute);margin-bottom:.8rem;font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:.7rem}
.pill{--l:80%;padding:.55rem 1.3rem;border:1px solid var(--line);border-radius:99px;display:flex;align-items:center;gap:.5rem;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,transparent) var(--l),transparent var(--l));transition:.2s}
.pill:hover{border-color:var(--accent)}
.pill img{width:18px;height:18px}
/* projects: cards stack as you scroll */
.stack{display:grid;gap:2rem}
.pcard{position:sticky;display:grid;grid-template-columns:1.1fr 1fr;gap:2rem;padding:1.4rem;border:1px solid var(--line);border-radius:28px;background:var(--bg2);box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.pcard .im{border-radius:18px;overflow:hidden;background:var(--card);min-height:220px}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}
.pcard h3{font-size:clamp(1.5rem,3vw,2.2rem);margin:.6rem 0}
.pcard p{color:var(--mute)}
.pcard .info{align-self:center}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}.tags span{padding:.15rem .75rem;border:1px solid var(--line);border-radius:99px;font-size:.82rem}
.star{color:var(--accent);font-size:.9rem;font-weight:500}
/* experience */
.xcol{display:grid;gap:1rem;margin-bottom:2.5rem}
.xrow{display:grid;grid-template-columns:1fr 1.2fr;gap:1.5rem;padding:1.6rem;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.xrow small{color:var(--mute)}
.xrow h3{font-size:clamp(1.3rem,3vw,1.9rem);margin:.3rem 0}
.xrow.now{border-color:var(--accent)}
.xrow p{color:var(--mute)}
.sub{font:500 1.2rem var(--head);margin:0 0 1rem;color:var(--mute)}
/* testimonials, blog */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}
.tcard,.bcard{padding:1.5rem;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.tcard q{display:block;margin-bottom:1rem;quotes:none;font-size:1.05rem}
.tcard div{display:flex;gap:.8rem;align-items:center;color:var(--mute);font-size:.9rem}
.tcard img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.bcard img{width:100%;border-radius:14px;margin-bottom:1rem;aspect-ratio:16/9;object-fit:cover}
.bcard small{color:var(--mute)}.bcard p{color:var(--mute);margin-top:.5rem}
/* contact */
.cform{display:grid;gap:.9rem;max-width:560px}
.cform input,.cform textarea{width:100%;padding:.9rem 1.1rem;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.cform textarea{min-height:140px;resize:vertical}
#msg{min-height:1.4em;color:var(--mute)}
footer{text-align:center;padding:3rem 1rem;color:var(--mute);border-top:1px solid var(--line)}
#boot{text-align:center;padding:30vh 1rem;color:var(--mute)}
@media(max-width:760px){.about,.pcard,.xrow{grid-template-columns:1fr}.pcard{position:relative;top:0!important}section{padding:4rem 1.2rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="glow"></div>
<nav><b id="brand">Portfolio</b><div id="links"></div></nav>
<main id="app"><p id="boot">Loading portfolio…</p></main>
<footer id="foot"></footer>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url = u => /^(https?:\/\/|\/|mailto:|tel:)/i.test(u || '') ? esc(u) : '#';
const get = (t, o = 'sort_order') => db.from(t).select('*').order(o, { ascending: t === 'posts' ? false : true });

// cursor-following glow
addEventListener('pointermove', e => {
  const g = document.getElementById('glow').style;
  g.setProperty('--x', e.clientX + 'px'); g.setProperty('--y', e.clientY + 'px');
});

function typing(el, words) {
  let w = 0, c = 0, del = false;
  const tick = () => {
    const word = words[w];
    el.firstElementChild.textContent = word.slice(0, c);
    if (!del && c === word.length) { del = true; return setTimeout(tick, 1800); }
    if (del && c === 0) { del = false; w = (w + 1) % words.length; }
    c += del ? -1 : 1;
    setTimeout(tick, del ? 35 : 75);
  };
  tick();
}

const R = {
  hero: (s, d) => `<section id="hero" class="rise">
    <div class="hello">${s.profile_image ? `<img src="${url(s.profile_image)}" alt="">` : '<i></i>'}${esc(s.tagline)}</div>
    <h1>${esc(s.hero_title)}</h1>
    <div class="type" id="type"><span></span></div>
    <div class="btns"><a class="btn main" href="#projects">See my work</a>
    ${s.cv_url ? `<a class="btn" href="${url(s.cv_url)}" target="_blank" rel="noopener">Download CV</a>` : ''}
    <a class="btn" href="#contact">Get in touch</a></div></section>`,

  about: (s, d) => `<section id="about"><h2>${esc(d.title)}</h2><div class="about">
    ${s.profile_image ? `<img src="${url(s.profile_image)}" alt="Portrait">` : ''}
    <div><p>${esc(s.about_text)}</p><div class="chips">
    ${s.email ? `<a class="chip" href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : ''}
    ${s.phone ? `<a class="chip" href="tel:${esc(s.phone)}">${esc(s.phone)}</a>` : ''}
    ${s.location ? `<span class="chip">${esc(s.location)}</span>` : ''}</div></div></div></section>`,

  skills: (s, d, x) => {
    if (!x.skills.length) return '';
    const cats = {};
    x.skills.forEach(k => (cats[k.category || 'Skills'] ||= []).push(k));
    return `<section id="skills"><h2>${esc(d.title)}</h2>${Object.entries(cats).map(([c, list]) =>
      `<div class="cat"><h3>${esc(c)}</h3><div class="pills">${list.map(k =>
        `<span class="pill" style="--l:${+k.level || 0}%">${k.icon_url ? `<img src="${url(k.icon_url)}" alt="">` : ''}${esc(k.name)}</span>`).join('')}</div></div>`).join('')}</section>`;
  },

  projects: (s, d, x) => x.projects.length ? `<section id="projects"><h2>${esc(d.title)}</h2><div class="stack">${x.projects.map((p, i) =>
    `<article class="pcard" style="top:${90 + i * 22}px"><div class="im">${p.image_url ? `<img src="${url(p.image_url)}" alt="${esc(p.title)}" loading="lazy">` : ''}</div>
    <div class="info">${p.featured ? '<span class="star">Featured project</span>' : ''}<h3>${esc(p.title)}</h3><p>${esc(p.summary || p.description)}</p>
    <div class="tags" style="margin:1rem 0">${(p.tech || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
    <div class="btns">${p.live_url ? `<a class="btn main" href="${url(p.live_url)}" target="_blank" rel="noopener">Live site</a>` : ''}${p.repo_url ? `<a class="btn" href="${url(p.repo_url)}" target="_blank" rel="noopener">Source code</a>` : ''}</div></div></article>`).join('')}</div></section>` : '',

  experience: (s, d, x) => xp('experience', d, x.experience.filter(e => e.kind === 'work'), 'No work history added yet.'),
  education: (s, d, x) => xp('education', d, x.experience.filter(e => e.kind === 'education')),

  testimonials: (s, d, x) => x.testimonials.length ? `<section id="testimonials"><h2>${esc(d.title)}</h2><div class="grid">${x.testimonials.map(t =>
    `<div class="tcard"><q>${esc(t.quote)}</q><div>${t.photo_url ? `<img src="${url(t.photo_url)}" alt="">` : ''}<span>${esc(t.name)}${t.role ? ', ' + esc(t.role) : ''}</span></div></div>`).join('')}</div></section>` : '',

  blog: (s, d, x) => x.posts.length ? `<section id="blog"><h2>${esc(d.title)}</h2><div class="grid">${x.posts.map(p =>
    `<article class="bcard">${p.cover_url ? `<img src="${url(p.cover_url)}" alt="" loading="lazy">` : ''}<small>${new Date(p.created_at).toLocaleDateString(undefined, { dateStyle: 'medium' })}</small><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p></article>`).join('')}</div></section>` : '',

  contact: (s, d, x) => `<section id="contact"><h2>${esc(d.title)}</h2>
    <form class="cform" id="cform"><input name="name" placeholder="Your name" required>
    <input name="email" type="email" placeholder="Your email" required><input name="subject" placeholder="Subject">
    <textarea name="body" placeholder="What would you like to build together?" required></textarea>
    <button class="btn main" type="submit">Send message</button><p id="msg" role="status"></p></form>
    <div class="chips" style="margin-top:1.5rem">${x.socials.map(l => `<a class="chip" href="${url(l.url)}" target="_blank" rel="noopener">${esc(l.platform)}</a>`).join('')}</div></section>`
};

function xp(id, d, rows, empty) {
  if (!rows.length) return '';
  return `<section id="${id}"><h2>${esc(d.title)}</h2><div class="xcol">${rows.map(e =>
    `<div class="xrow${e.is_current ? ' now' : ''}"><div><small>${esc(e.organization)}${e.location ? ', ' + esc(e.location) : ''}</small><h3>${esc(e.title)}</h3></div>
    <div><p>${esc(e.description)}</p><small>${esc(e.start_date)} to ${e.is_current ? 'Present' : esc(e.end_date)}</small></div></div>`).join('')}</div></section>`;
}

(async function init() {
  try {
    const [st, se, pr, sk, ex, te, po, so] = await Promise.all([
      db.from('site_settings').select('*'), get('sections'), get('projects'), get('skills'),
      get('experience'), get('testimonials'), get('posts', 'created_at'), get('social_links')]);
    if (st.error) throw st.error;
    const s = Object.fromEntries(st.data.map(r => [r.key, r.value || '']));
    const x = { projects: pr.data || [], skills: sk.data || [], experience: ex.data || [], testimonials: te.data || [], posts: po.data || [], socials: so.data || [] };
    const secs = (se.data || []).filter(z => z.enabled);

    document.documentElement.dataset.theme = s.theme === 'light' ? 'light' : 'dark';
    if (/^#[0-9a-f]{3,8}$/i.test(s.accent_color)) document.documentElement.style.setProperty('--accent', s.accent_color);
    document.title = s.site_title || 'Portfolio';
    document.getElementById('brand').textContent = s.site_title || 'Portfolio';
    if (s.seo_description) { const m = document.createElement('meta'); m.name = 'description'; m.content = s.seo_description; document.head.append(m); }
    if (s.favicon_url) { const l = document.createElement('link'); l.rel = 'icon'; l.href = s.favicon_url; document.head.append(l); }

    document.getElementById('links').innerHTML = secs.filter(z => z.key !== 'hero').map(z => `<a href="#${esc(z.key)}">${esc(z.title)}</a>`).join('');
    document.getElementById('app').innerHTML = secs.map(z => R[z.key] ? R[z.key](s, z, x) : '').join('');
    document.getElementById('foot').textContent = s.footer_text;

    const t = document.getElementById('type');
    if (t) typing(t, (s.hero_subtitle || '').split(';').map(v => v.trim()).filter(Boolean).concat([]).length ? s.hero_subtitle.split(';').map(v => v.trim()).filter(Boolean) : ['Welcome']);

    const f = document.getElementById('cform');
    if (f) f.addEventListener('submit', async e => {
      e.preventDefault();
      const m = document.getElementById('msg'), b = f.querySelector('button');
      b.disabled = true; m.textContent = 'Sending…';
      const { error } = await db.from('messages').insert(Object.fromEntries(new FormData(f)));
      b.disabled = false;
      if (error) { m.textContent = 'Message failed to send. Please try again or email me directly.'; return; }
      f.reset(); m.textContent = 'Message sent. Thank you!';
    });
  } catch (err) {
    document.getElementById('app').innerHTML = '<p id="boot">Could not load the site. Check SUPABASE_URL and SUPABASE_ANON_KEY in config.js.</p>';
    console.error(err);
  }
})();
</script>
</body>
</html>
